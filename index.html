var DATA_KEY = 'librus_synergia_db_v3';

function storageOk(){
  try {
    localStorage.setItem('__t','1');
    localStorage.removeItem('__t');
    return true;
  } catch(e){ return false; }
}

function collectState(){
  return {
    v: 3,
    teachers: teachers,
    studentsList: studentsList,
    classesList: classesList,
    groupsList: groupsList,
    subjectsList: subjectsList,
    planLessons: planLessons,
    announcements: announcements,
    substitutions: substitutions,
    directorNotes: directorNotes,
    generatedLogins: generatedLogins,
    dynamicAccounts: dynamicAccounts,
    classArchive: classArchive,
    userProfiles: userProfiles,
    nextId: nextId,
    savedAt: new Date().toISOString()
  };
}

function applyState(d){
  if(!d || typeof d !== 'object') return false;
  if(Array.isArray(d.teachers)) teachers = d.teachers;
  if(Array.isArray(d.studentsList)) studentsList = d.studentsList;
  if(Array.isArray(d.classesList)) classesList = d.classesList;
  if(Array.isArray(d.groupsList)) groupsList = d.groupsList;
  if(Array.isArray(d.subjectsList)) subjectsList = d.subjectsList;
  if(Array.isArray(d.planLessons)) planLessons = d.planLessons;
  if(Array.isArray(d.announcements)) announcements = d.announcements;
  if(Array.isArray(d.substitutions)) substitutions = d.substitutions;
  if(Array.isArray(d.directorNotes)) directorNotes = d.directorNotes;
  if(Array.isArray(d.generatedLogins)) generatedLogins = d.generatedLogins;
  if(d.dynamicAccounts && typeof d.dynamicAccounts === 'object') dynamicAccounts = d.dynamicAccounts;
  if(Array.isArray(d.classArchive)) classArchive = d.classArchive;
  if(d.userProfiles && typeof d.userProfiles === 'object') userProfiles = d.userProfiles;
  if(typeof d.nextId === 'number') nextId = d.nextId;
  return true;
}

function saveData(){
  try {
    if(!storageOk()){
      showSaveStatus(false, 'localStorage niedostępny');
      return false;
    }
    var str = JSON.stringify(collectState());
    localStorage.setItem(DATA_KEY, str);
    // stary klucz też (kompatybilność)
    try { localStorage.setItem('librus_data_v1', str); } catch(e){}
    var verify = localStorage.getItem(DATA_KEY);
    if(!verify){
      showSaveStatus(false, 'weryfikacja nieudana');
      return false;
    }
    showSaveStatus(true);
    return true;
  } catch(e){
    console.error('saveData', e);
    showSaveStatus(false, e.message);
    return false;
  }
}

function loadData(){
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if(!raw) raw = localStorage.getItem('librus_data_v1');
    if(!raw){
      showSaveStatus(false, 'brak zapisu');
      return false;
    }
    var d = JSON.parse(raw);
    applyState(d);
    showSaveStatus(true);
    console.log('[Librus] Wczytano zapis z', d.savedAt);
    return true;
  } catch(e){
    console.error('loadData', e);
    showSaveStatus(false, e.message);
    return false;
  }
}

function showSaveStatus(ok, err){ /* status ukryty */ }

function exportData(){
  saveData();
  var str = JSON.stringify(collectState(), null, 2);
  var blob = new Blob([str], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'librus-backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('Kopia zapisana na dysk (librus-backup.json)');
}

function importData(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = function(){
    var file = inp.files && inp.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var d = JSON.parse(reader.result);
        applyState(d);
        saveData();
        toast('Zaimportowano – dane przywrócone');
        if(typeof currentRole !== 'undefined' && currentRole){
          renderSidebar();
          renderContent(getDefaultTab());
        }
      } catch(e){
        toast('Błąd pliku: '+e.message, true);
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function renderUPlan(m){
  var klasa = (currentUser && currentUser.class) || '3A';
  var days = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek'];
  var dayKeys = ['pn','wt','sr','cz','pt'];
  var hours = [
    {n:1,t:'8:00–8:45'},{n:2,t:'8:55–9:40'},{n:3,t:'9:50–10:35'},
    {n:4,t:'10:55–11:40'},{n:5,t:'11:50–12:35'},{n:6,t:'12:45–13:30'}
  ];
  var colorMap = {Matematyka:'tt-mat','Język polski':'tt-pol','Język angielski':'tt-ang',Historia:'tt-his',Biologia:'tt-bio',Chemia:'tt-che',Fizyka:'tt-fiz','Wychowanie fizyczne':'tt-wf',Geografia:'tt-geo'};
  subjectsList.forEach(function(s){ if(s.name) colorMap[s.name] = 'tt-'+(s.color||'other'); });
  var classExists = classesList.some(function(c){return c.name===klasa;});
  var myPlan = planLessons.filter(function(p){return p.className===klasa;});

  if(!classExists){
    m.innerHTML = '<div class="page-title">Plan lekcji</div><div class="card"><div class="card-body"><p style="color:#888">Brak aktywnej klasy „'+klasa+'” w systemie – plan niedostępny.</p></div></div>';
    return;
  }
  if(!myPlan.length){
    m.innerHTML = '<div class="page-title">Plan lekcji · '+klasa+'</div><div class="card"><div class="card-body"><p style="color:#888">Plan lekcji dla klasy '+klasa+' nie został jeszcze ułożony.</p></div></div>';
    return;
  }
  var grid = '<div class="timetable"><div class="tt-header">Lekcja</div>';
  days.forEach(function(d){ grid += '<div class="tt-header">'+d+'</div>'; });
  hours.forEach(function(h){
    grid += '<div class="tt-time">'+h.n+'<small>'+h.t+'</small></div>';
    for(var di=0; di<5; di++){
      var cell = myPlan.find(function(p){ return Number(p.lesson)===h.n && p.day===dayKeys[di]; });
      if(cell){
        var cls = colorMap[cell.subject] || 'tt-other';
        grid += '<div class="tt-lesson '+cls+'"><div class="subject">'+cell.subject+'</div>'+
          (cell.teacher?'<div class="teacher">'+cell.teacher+'</div>':'')+
          (cell.room?'<div class="room">'+cell.room+'</div>':'')+'</div>';
      } else grid += '<div class="tt-empty"></div>';
    }
  });
  grid += '</div>';
  m.innerHTML = '<div class="page-title">Plan lekcji · '+klasa+'</div><div class="card"><div class="card-body" style="padding:12px;overflow-x:auto">'+grid+'</div></div>';
}

function renderDPlan(m){
  var days = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek'];
  var dayKeys = ['pn','wt','sr','cz','pt'];
  var classNames = classesList.map(function(c){return c.name;});
  var filterClass = window._planFilterClass || (classNames[0] || '');
  var hours = [
    {n:1,t:'8:00–8:45'},{n:2,t:'8:55–9:40'},{n:3,t:'9:50–10:35'},
    {n:4,t:'10:55–11:40'},{n:5,t:'11:50–12:35'},{n:6,t:'12:45–13:30'}
  ];
  var colorMap = {Matematyka:'tt-mat','Język polski':'tt-pol','Język angielski':'tt-ang',Historia:'tt-his',Biologia:'tt-bio',Chemia:'tt-che',Fizyka:'tt-fiz','Wychowanie fizyczne':'tt-wf',Geografia:'tt-geo'};
  subjectsList.forEach(function(s){ if(s.name && s.color) colorMap[s.name] = 'tt-'+(s.color||'other'); });

  var classSelect = '<select id="plan-class-filter" onchange="window._planFilterClass=this.value;renderContent(\'d-plan\')" style="padding:6px 10px;border-radius:5px;border:1px solid #ccc;margin-left:8px">';
  if(!classNames.length) classSelect += '<option value="">Brak klas</option>';
  classNames.forEach(function(cn){
    classSelect += '<option value="'+cn+'"'+(cn===filterClass?' selected':'')+'>'+cn+'</option>';
  });
  classSelect += '</select>';

  var grid = '<div class="timetable"><div class="tt-header">Lekcja</div>';
  days.forEach(function(d){ grid += '<div class="tt-header">'+d+'</div>'; });

  hours.forEach(function(h){
    grid += '<div class="tt-time">'+h.n+'<small>'+h.t+'</small></div>';
    for(var di=0; di<5; di++){
      var cell = planLessons.find(function(p){
        return p.className===filterClass && Number(p.lesson)===h.n && p.day===dayKeys[di];
      });
      if(cell){
        var cls = colorMap[cell.subject] || 'tt-other';
        grid += '<div class="tt-lesson '+cls+'"><div class="subject">'+cell.subject+'</div>'+
          (cell.teacher?'<div class="teacher">'+cell.teacher+'</div>':'')+
          (cell.room?'<div class="room">'+cell.room+'</div>':'')+
          '<div style="margin-top:4px"><button class="btn btn-danger btn-sm" style="padding:2px 6px;font-size:10px" onclick="deletePlanLesson('+cell.id+')">Usuń</button></div></div>';
      } else {
        grid += '<div class="tt-empty"></div>';
      }
    }
  });
  grid += '</div>';

  var emptyMsg = !classNames.length
    ? '<p style="padding:16px;color:#888">Najpierw dodaj klasę w zakładce Klasy, potem dodawaj lekcje do planu.</p>'
    : (!planLessons.filter(function(p){return p.className===filterClass}).length
      ? '<p style="padding:12px 0 0;font-size:13px;color:#888">Brak lekcji w planie dla tej klasy – użyj „Dodaj lekcję”.</p>' : '');

  m.innerHTML = '<div class="page-title">Plan lekcji '+classSelect+
    ' <button class="btn btn-primary btn-sm" onclick="openModal(\'Dodaj lekcję do planu\',planForm(),savePlanLesson)" '+(classNames.length?'':'disabled')+'>+ Dodaj lekcję</button></div>'+
    '<div class="card"><div class="card-header">Plan'+(filterClass?' · klasa '+filterClass:'')+'</div><div class="card-body" style="padding:12px;overflow-x:auto">'+
    (classNames.length ? grid : '') + emptyMsg + '</div></div>';
}
function savePlanLesson(){

function generateLogin(){
  var type=document.getElementById('l-type').value;
  var name=document.getElementById('l-name').value.trim();
  var klasaEl=document.getElementById('l-class');
  var klasa=(klasaEl && klasaEl.value.trim()) || '';
  if(!name){toast('Podaj imię i nazwisko',true);return;}
  var login, pass=genPass(), role, initials;
  initials = name.split(' ').map(function(p){return (p[0]||'').toUpperCase()}).join('').substring(0,2);
  if(type==='Uczeń'){
    login=genStudentLogin(name);
    role='uczen';
    dynamicAccounts[login]={pass:pass,role:role,name:name,class:klasa||'3A',initials:initials,email:login+'@sp15.edu.pl'};
  } else if(type==='Nauczyciel'){
    login=genTeacherLogin(name);
    role='nauczyciel';
    dynamicAccounts[login]={pass:pass,role:role,name:name,subject:'',initials:initials,email:login+'@sp15.edu.pl'};
  } else {
    var parts=name.toLowerCase().replace(/ą/g,'a').replace(/ę/g,'e').replace(/ó/g,'o').replace(/ł/g,'l').split(/\s+/);
    login=(parts[0]||'rodzic')+'.'+(parts[1]||'x');
    role='uczen';
    dynamicAccounts[login]={pass:pass,role:role,name:name,class:klasa,initials:initials,email:login+'@email.pl'};
  }
  generatedLogins.unshift({type:type,name:name,login:login,pass:pass,date:new Date().toLocaleDateString('pl-PL')});
  toast('Login: '+login+' · Hasło: '+pass); saveData(); closeModal();renderContent('d-loginy');
}

  if(!name){toast('Podaj imię i nazwisko',true);return;}
  if(window._editStudentId){
    var s=studentsList.find(function(x){return x.id===window._editStudentId});
    if(s){
      s.name=name;
      s.class=klasa;
      if(dynamicAccounts[s.login]){ dynamicAccounts[s.login].name=name; dynamicAccounts[s.login].class=klasa; }
    }
    window._editStudentId=null;
    toast('Dane ucznia zapisane'); saveData();
  } else {
    var login=genStudentLogin(name);
    var pass=genPass();
    var initials=name.split(' ').map(function(p){return (p[0]||'').toUpperCase()}).join('').substring(0,2);
    var email=login+'@sp15.edu.pl';
    studentsList.push({id:nextId++,name:name,class:klasa,login:login,email:email,tempPass:pass});
    dynamicAccounts[login]={pass:pass,role:'uczen',name:name,class:klasa,initials:initials,email:email};
    generatedLogins.unshift({type:'Uczeń',name:name,login:login,pass:pass,date:new Date().toLocaleDateString('pl-PL')});
    toast('Uczeń dodany · login: '+login+' · hasło: '+pass); saveData();
  }
  saveData(); closeModal();renderContent('d-uczniowie');
}
function editStudent(id){
  id=Number(id);
  var s=studentsList.find(function(x){return x.id===id});
  if(!s)return;
  window._editStudentId=id;
  openModal('Edytuj ucznia',studentForm(s),saveStudent);
}
function deleteStudent(id){
  id=Number(id);
  var s=studentsList.find(function(x){return x.id===id});
  if(s && dynamicAccounts[s.login]) delete dynamicAccounts[s.login];
  studentsList=studentsList.filter(function(x){return x.id!==id});
  toast('Uczeń usunięty'); saveData(); renderContent('d-uczniowie');
}
function renderDKlasy(m){
  var rows = classesList.map(function(c){
    return '<tr><td><strong>'+c.name+'</strong></td><td>'+c.level+'</td><td>'+c.tutor+'</td><td>'+c.students+'</td><td>'+c.room+'</td>'+
      '<td><button class="btn btn-outline btn-sm" data-id="'+c.id+'" onclick="editClass(this.getAttribute(\'data-id\'))">Edytuj</button> '+
      '<button class="btn btn-danger btn-sm" data-id="'+c.id+'" onclick="deleteClass(this.getAttribute(\'data-id\'))">Do archiwum</button></td></tr>';
  }).join('');
  var arch = classArchive.map(function(c){
    return '<tr style="opacity:.75"><td><strong>'+c.name+'</strong></td><td>'+c.level+'</td><td>'+c.tutor+'</td><td>'+c.students+'</td><td>'+c.room+'</td><td style="font-size:12px;color:#888">'+c.archivedAt+
      ' <button class="btn btn-outline btn-sm" data-id="'+c.id+'" onclick="restoreClass(this.getAttribute(\'data-id\'))">Przywróć</button></td></tr>';
  }).join('') || '<tr><td colspan="6" class="empty-state">Brak klas w archiwum</td></tr>';
  m.innerHTML = '<div class="page-title">Klasy <button class="btn btn-primary btn-sm" onclick="openModal(\'Dodaj klasę\',classForm(),saveClass)">+ Dodaj klasę</button></div>'+
    '<div class="card"><div class="card-header">Aktywne klasy</div><div class="card-body" style="padding:0"><table><thead><tr><th>Klasa</th><th>Rocznik</th><th>Wychowawca</th><th>Uczniów</th><th>Sala</th><th>Akcje</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="6" class="empty-state">Brak klas</td></tr>')+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-header">Archiwum klas</div><div class="card-body" style="padding:0"><table><thead><tr><th>Klasa</th><th>Rocznik</th><th>Wychowawca</th><th>Uczniów</th><th>Sala</th><th>Usunięto / akcje</th></tr></thead>'+
    '<tbody>'+arch+'</tbody></table></div></div>';
}
function restoreClass(id){
  id=Number(id);
  var c = classArchive.find(function(x){return x.id===id});
  if(!c) return;
  classArchive = classArchive.filter(function(x){return x.id!==id});
  classesList.push({id:c.id,name:c.name,level:c.level,tutor:c.tutor,students:c.students,room:c.room});
  saveData();
  toast('Klasa przywrócona'); saveData(); renderContent('d-klasy');
}

function renderDGrupy(m){
  var rows = groupsList.map(function(g){
    return '<tr><td><strong>'+g.name+'</strong></td><td>'+g.type+'</td><td>'+g.leader+'</td><td>'+g.members+'</td>'+
      '<td><button class="btn btn-outline btn-sm" data-id="'+g.id+'" onclick="editGroup(this.getAttribute(\'data-id\'))">Edytuj</button> '+
      '<button class="btn btn-danger btn-sm" data-id="'+g.id+'" onclick="deleteGroup(this.getAttribute(\'data-id\'))">Usuń</button></td></tr>';
  }).join('');
  m.innerHTML = '<div class="page-title">Grupy <button class="btn btn-primary btn-sm" onclick="openModal(\'Dodaj grupę\',groupForm(),saveGroup)">+ Utwórz grupę</button></div>'+
    '<div class="card"><div class="card-body" style="padding:0"><table><thead><tr><th>Nazwa</th><th>Typ</th><th>Opiekun</th><th>Członków</th><th>Akcje</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div></div>';
}

function classForm(c){
  c = c || {};
  return '<div class="form-row"><div class="form-group"><label>Nazwa klasy</label><input id="c-name" value="'+(c.name||'')+'" placeholder="np. 4A"></div>'+
    '<div class="form-group"><label>Rocznik / poziom</label><input id="c-level" value="'+(c.level||'')+'" placeholder="np. 4"></div></div>'+
    '<div class="form-group"><label>Wychowawca</label><input id="c-tutor" value="'+(c.tutor||'')+'" placeholder="mgr ..."></div>'+
    '<div class="form-row"><div class="form-group"><label>Liczba uczniów</label><input id="c-students" type="number" value="'+(c.students||0)+'" min="0"></div>'+
    '<div class="form-group"><label>Sala</label><input id="c-room" value="'+(c.room||'')+'" placeholder="s.12"></div></div>';
}
function saveClass(){
  var nameEl = document.getElementById('c-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if(!name){ toast('Podaj nazwę klasy', true); return; }
  var obj = {
    id: nextId++,
    name: name,
    level: (document.getElementById('c-level')||{}).value || '',
    tutor: (document.getElementById('c-tutor')||{}).value || '',
    students: parseInt((document.getElementById('c-students')||{}).value, 10) || 0,
    room: (document.getElementById('c-room')||{}).value || ''
  };
  if(window._editClassId){
    var c = classesList.find(function(x){ return x.id === window._editClassId; });
    if(c){
      c.name = obj.name;
      c.level = obj.level;
      c.tutor = obj.tutor;
      c.students = obj.students;
      c.room = obj.room;
    }
    window._editClassId = null;
    toast('Klasa zaktualizowana');
  } else {
    classesList.push(obj);
    toast('Klasa dodana');
  }
  saveData();
  closeModal();
  renderContent('d-klasy');
}
function editClass(id){
  id = Number(id);
  var c = classesList.find(function(x){ return x.id === id; });
  if(!c){ toast('Nie znaleziono klasy', true); return; }
  window._editClassId = id;
  openModal('Edytuj klasę', classForm(c), saveClass);
}
function deleteClass(id){
  id = Number(id);
  var c = classesList.find(function(x){ return x.id === id; });
  if(c){
    classArchive.unshift({
      id: c.id, name: c.name, level: c.level, tutor: c.tutor,
      students: c.students, room: c.room,
      archivedAt: new Date().toLocaleString('pl-PL')
    });
    classesList = classesList.filter(function(x){ return x.id !== id; });
    saveData();
    toast('Klasa przeniesiona do archiwum');
  }
  renderContent('d-klasy');
}
function groupForm(g){
  g = g || {};
  var types = ['zajęcia dodatkowe','sport','wyrównawcza','inna'];
  var opts = types.map(function(t){
    return '<option value="'+t+'"'+(g.type===t?' selected':'')+'>'+t+'</option>';
  }).join('');
  return '<div class="form-group"><label>Nazwa grupy</label><input id="g-name" value="'+(g.name||'')+'"></div>'+
    '<div class="form-group"><label>Typ</label><select id="g-type">'+opts+'</select></div>'+
    '<div class="form-group"><label>Opiekun</label><input id="g-leader" value="'+(g.leader||'')+'"></div>'+
    '<div class="form-group"><label>Liczba członków</label><input id="g-members" type="number" value="'+(g.members||0)+'" min="0"></div>';
}
function saveGroup(){
  var nameEl = document.getElementById('g-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if(!name){ toast('Podaj nazwę grupy', true); return; }
  var obj = {
    id: nextId++,
    name: name,
    type: (document.getElementById('g-type')||{}).value || 'inna',
    leader: (document.getElementById('g-leader')||{}).value || '',
    members: parseInt((document.getElementById('g-members')||{}).value, 10) || 0
  };
  if(window._editGroupId){
    var g = groupsList.find(function(x){ return x.id === window._editGroupId; });
    if(g){
      g.name = obj.name;
      g.type = obj.type;
      g.leader = obj.leader;
      g.members = obj.members;
    }
    window._editGroupId = null;
    toast('Grupa zaktualizowana');
  } else {
    groupsList.push(obj);
    toast('Grupa utworzona');
  }
  saveData();
  closeModal();
  renderContent('d-grupy');
}
function editGroup(id){
  id = Number(id);
  var g = groupsList.find(function(x){ return x.id === id; });
  if(!g){ toast('Nie znaleziono grupy', true); return; }
  window._editGroupId = id;
  openModal('Edytuj grupę', groupForm(g), saveGroup);
}
function deleteGroup(id){
  id = Number(id);
  groupsList = groupsList.filter(function(g){ return g.id !== id; });
  saveData();
  toast('Grupa usunięta');
  renderContent('d-grupy');
}
function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderProfil(m){
  var u = currentUser || {};
  var roleLabel = {uczen:'Uczeń',nauczyciel:'Nauczyciel',dyrektor:'Dyrektor'}[currentRole]||'';
  var html = '<div class="page-title">Mój profil</div>'+
    '<div class="card"><div class="card-header">Dane konta</div><div class="card-body">'+
    '<div class="form-group"><label>Login</label><input value="'+escAttr(u.login||'')+'" disabled style="background:#f0f0f0;color:#555"></div>'+
    '<div class="form-group"><label>Imię i nazwisko</label><input id="p-name" value="'+escAttr(u.name)+'"></div>';
  if(currentRole==='uczen'){
    html += '<div class="form-group"><label>Klasa</label><input id="p-class" value="'+escAttr(u.class)+'"></div>';
  }
  if(currentRole==='nauczyciel'){
    html += '<div class="form-group"><label>Przedmiot</label><input id="p-subject" value="'+escAttr(u.subject)+'"></div>';
  }
  html += '<div class="form-group"><label>Rola</label><input value="'+roleLabel+'" disabled style="background:#f0f0f0;color:#555"></div>'+
    '<div class="form-group"><label>E-mail</label><input id="p-email" type="email" value="'+escAttr(u.email)+'"></div>'+
    '<div class="form-group"><label>Telefon</label><input id="p-phone" value="'+escAttr(u.phone)+'" placeholder="np. 500 100 200"></div>'+
    '<div class="form-group"><label>Nowe hasło (opcjonalnie)</label><input id="p-pass" type="password" placeholder="Zostaw puste, aby nie zmieniać"></div>'+
    '<button type="button" class="btn btn-primary" onclick="saveProfile()">Zapisz zmiany</button>'+
    '</div></div>';
  m.innerHTML = html;
}
function saveProfile(){
  var nameEl = document.getElementById('p-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if(!name){ toast('Podaj imię i nazwisko', true); return; }

  currentUser.name = name;
  var cls = document.getElementById('p-class');
  if(cls) currentUser.class = cls.value.trim();
  var sub = document.getElementById('p-subject');
  if(sub) currentUser.subject = sub.value.trim();
  var em = document.getElementById('p-email');
  if(em) currentUser.email = em.value.trim();
  var ph = document.getElementById('p-phone');
  if(ph) currentUser.phone = ph.value.trim();

  var parts = name.split(/\s+/);
  currentUser.initials = ((parts[0]&&parts[0][0])||'') + ((parts[1]&&parts[1][0])||'');
  currentUser.initials = currentUser.initials.toUpperCase();

  var login = currentUser.login || '';
  if(login){
    userProfiles[login] = {
      name: currentUser.name,
      email: currentUser.email || '',
      phone: currentUser.phone || '',
      class: currentUser.class || '',
      subject: currentUser.subject || ''
    };
    // zmiana hasła
    var passEl = document.getElementById('p-pass');
    var newPass = passEl ? passEl.value : '';
    if(newPass && newPass.length >= 3){
      if(dynamicAccounts[login]) dynamicAccounts[login].pass = newPass;
      userProfiles[login].pass = newPass;
      // stałe konta demo – dopisz do dynamicAccounts
      if(!dynamicAccounts[login]){
        dynamicAccounts[login] = {
          pass: newPass,
          role: currentRole,
          name: currentUser.name,
          class: currentUser.class || '',
          subject: currentUser.subject || '',
          initials: currentUser.initials,
          email: currentUser.email || ''
        };
      }
      toast('Profil i hasło zapisane');
    } else {
      toast('Profil zapisany');
    }
    // zaktualizuj listę uczniów/nauczycieli jeśli pasuje login
    studentsList.forEach(function(s){
      if(s.login === login){ s.name = currentUser.name; if(currentUser.class) s.class = currentUser.class; if(currentUser.email) s.email = currentUser.email; }
    });
    teachers.forEach(function(t){
      if(t.login === login){ t.name = currentUser.name; if(currentUser.subject) t.subject = currentUser.subject; if(currentUser.email) t.email = currentUser.email; }
    });
  } else {
    toast('Profil zapisany');
  }

  var un = document.getElementById('user-name');
  var av = document.getElementById('user-avatar');
  if(un) un.textContent = currentUser.name + (currentUser.class ? ' · ' + currentUser.class : '');
  if(av) av.textContent = currentUser.initials;
  saveData();
}

function openModal(title,bodyHtml,onSave){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  document.getElementById('modal-footer').innerHTML=`<button class="btn btn-outline" onclick="closeModal()">Anuluj</button><button class="btn btn-primary" id="modal-save">Zapisz</button>`;
  document.getElementById('modal-save').onclick=onSave;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(msg,isError){
  if(isError===undefined) isError=false;
  var t=document.getElementById('toast');
  if(t){ t.textContent=msg; t.className='toast show'+(isError?' error':''); setTimeout(function(){ t.classList.remove('show'); },2800); }
  if(!isError){ try{ saveData(); }catch(e){} }
}



</script>
</body>
