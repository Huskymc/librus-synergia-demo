<script>
try {
  var b64 = (window.__LIBRUS_CHUNKS||[]).join('');
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var html = new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
} catch(e) {
  document.getElementById('boot').textContent = 'Błąd ładowania: '+e.message;
}
</script>
